<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rejseplanen</title> <!-- Hjemmesidens titel-->
    <link rel="stylesheet" href="style.css" />  <!-- Min CSS-fil -->
</head>
<body>
<!-- Rejseplan logo højre hjørne-->
<header class="top-bar">
    <img src="./rejseplanlogo.png" alt="Rejseplan logo" class="logo" />
    <nav>
        <a href="#">Find en rejse</a>
        <a href="#">Afgangstavler</a>
        <a href="#">Beta</a>
    </nav>
</header>

<!-- Hero-sektion med baggrundsbillede -->
<section class="hero">

    <!-- Hvid søge-boks -->
    <form class="card" action="#" method="get">
        <h2>Rejs: i Danmark</h2>

        <div class="input-group">
            <label for="from">Fra</label>
            <input id="from" name="from" type="text" placeholder="Fx. København H" required />
        </div>

        <div class="input-group">
            <label for="to">Til</label>
            <input id="to" name="to" type="text" placeholder="Fx. Aarhus C" required />
        </div>

        <div class="row">
            <label class="sr-only" for="date">Afgang</label>
            <input id="date" name="date" type="datetime-local" />
            <button class="find-btn" type="submit">Find</button>
        </div>
    </form>
</section>

<!-- Footer -->
<footer>
        <nav class="footer-links" aria-label="Footer links">
            <a href="#">Hjælp</a>
            <a href="#">Om</a>
            <a href="#">Labs</a>
            <a href="#">Erhverv</a>
            <a href="#">Privatliv & cookies</a>
            <a href="#">Ændre cookiesamtykke</a>
            <a href="#">Tilgængelighedserklæring</a>
        </nav>
    </footer>
</body>
</html>
